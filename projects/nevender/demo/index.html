<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nevender</title>

        <style>
            body {
                margin: 0px;
            }

            #dag-toggle {
                position: absolute;
                top: 0px;
                right: 0px;
                z-index: 0;
            }

            #dag-canvas {
                width: 80vw;
                height: 40vw;
                position: absolute;
                top: 25px;
                right: 0px;
                z-index: 0;
                background-color: white;
            }

            #distance-slider {
                position: absolute;
                right: 0px;
                bottom: 2em;
                z-index: 0;
            }

            #threshold-slider {
                position: absolute;
                right: 0px;
                z-index: 0;
                bottom: 1em;
            }

            canvas {
                margin: 0px;
            }
        </style>
    </head>
    <body>
        <script type="importmap">
            {
                "imports": {
                    "three": "/three/build/three.module.js"
                }
            }
        </script>
        
        <button
            id="dag-toggle"
            title="Show DAG"
            onclick="toggledisplay('dag-canvas')"
        >
            Toggle DAG
        </button>
        <canvas id="dag-canvas"></canvas>
        <input
            type="range"
            id="distance-slider"
            min="0"
            max="800"
            value="0"
            step="1"
        />
        <input
            type="range"
            id="threshold-slider"
            min="0"
            max="30"
            value="0.1"
            step="0.1"
        />

        <script>
            function toggledisplay(elementID) {
                (function (style) {
                    style.display = style.display === "none" ? "" : "none";
                })(document.getElementById(elementID).style);
            }
        </script>

        <script src="script.js" type="module"></script>
    </body>
</html>
